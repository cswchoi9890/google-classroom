<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>환경 영수증 & AI 분리배출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700;800&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  /* [기존 CSS 내용은 그대로 유지됩니다. 글자수 제한으로 중략 없이 핵심 추가 부분만 작성] */
  :root{
    --paper:#F7F3E7; --paper-dim:#ECE6D2; --counter-1:#3a382f; --counter-2:#23221c;
    --ink:#262420; --ink-soft:#6b6452; --stamp:#B2362A; --eco:#3C6E4F;
    --eco-soft:#5d8a6c; --line:#cfc8ae; --warn:#a8632b;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Nanum Gothic Coding', monospace; color:var(--ink);
    background: radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.05), transparent 55%),
                linear-gradient(160deg, var(--counter-1), var(--counter-2));
    padding:28px 16px 60px;
  }
  .app{max-width:1080px; margin:0 auto;}
  
  /* 기존 스타일 생략 ... (사용자가 제공한 원본 CSS가 여기에 들어갑니다) */

  /* AI 입력창 전용 스타일 추가 */
  .ai-panel {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 16px; margin-bottom: 24px; display: flex; gap: 10px;
  }
  .ai-panel input {
    flex: 1; padding: 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.9);
    font-family: inherit; font-size: 0.9rem;
  }
  .ai-panel button {
    background: var(--eco); color: white; border: none; padding: 0 20px;
    border-radius: 8px; font-family: inherit; font-weight: bold; cursor: pointer;
  }
  .ai-panel button:hover { background: var(--eco-soft); }
  .ai-loading { display: none; color: #cfe7d7; font-size: 0.8rem; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div class="eyebrow">Eco Impact Calculator</div>
    <h1>환경 영수증 & AI 분리배출</h1>
    <p>어떤 물건을 버리거나 샀나요? AI가 분리배출 항목과 환경 발자국을 계산해 드립니다.</p>
  </div>

  <!-- AI 분석 입력창 -->
  <div class="ai-panel">
    <input type="text" id="aiInput" placeholder="예: 다 마신 플라스틱 커피컵, 낡은 청바지" />
    <button id="aiBtn">AI 분석 추가</button>
  </div>
  <div class="ai-loading" id="aiLoading">Cloudflare AI가 분석 중입니다... ♻️</div>

  <!-- 기존 장바구니/영수증 레이아웃 -->
  <div class="layout">
    <section class="picker" aria-label="품목 선택">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="item-grid" id="itemGrid"></div>
    </section>

    <!-- 영수증 UI 생략 (원본 HTML과 동일) ... -->
  </div>
</div>

<script>
(function(){
  "use strict";
  
  // 백엔드 URL (Cloudflare Worker 배포 후 해당 도메인으로 변경)
  const API_URL = "https://eco-receipt-ai.YOUR_SUBDOMAIN.workers.dev/api/analyze";
  
  /* 기존 ECO_DB 및 영수증 계산 로직 생략 (원본 스크립트 내용 유지) ... */
  // 편의상 AI 동적 추가를 위해 ECO_DB 구조를 전역에서 참조 가능하게 구성합니다.

  // AI 분석 버튼 이벤트 리스너
  const $aiBtn = document.getElementById("aiBtn");
  const $aiInput = document.getElementById("aiInput");
  const $aiLoading = document.getElementById("aiLoading");

  $aiBtn.addEventListener("click", async () => {
    const itemQuery = $aiInput.value.trim();
    if(!itemQuery) return;

    $aiLoading.style.display = "block";
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item: itemQuery })
      });
      
      const data = await response.json();
      if(data.error) throw new Error(data.error);

      // AI가 분석한 데이터를 임시 DB에 추가하고 장바구니 수량 1 증가
      const newId = "ai_" + Date.now();
      const targetCategory = ECO_DB[data.category] ? data.category : "daily";
      
      const newItem = {
        id: newId, 
        name: data.name || itemQuery, 
        unit: "1개(AI추정)", 
        icon: "🤖", 
        co2: data.co2 || 0.1, 
        water: data.water || 5
      };

      ECO_DB[targetCategory].items.unshift(newItem);
      ITEM_INDEX[newId] = {...newItem, category: targetCategory};
      
      // 장바구니에 담고 화면 리렌더링
      cartState[newId] = 1;
      activeTab = targetCategory;
      
      renderTabs();
      renderItemGrid();
      renderReceipt();
      
      $aiInput.value = "";
      alert("AI가 분석하여 목록에 추가했습니다!");
    } catch(err) {
      alert("AI 분석 중 오류가 발생했습니다: " + err.message);
    } finally {
      $aiLoading.style.display = "none";
    }
  });

  /* 기존 init(), render() 함수들 생략... */
})();
</script>
</body>
</html>
