<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 분리배출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700;800&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root{
    --counter-1:#3a382f;
    --counter-2:#23221c;
    --ink:#262420;
    --eco:#3C6E4F;
    --eco-soft:#5d8a6c;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Nanum Gothic Coding', monospace; color:var(--ink);
    background: radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.05), transparent 55%),
                linear-gradient(160deg, var(--counter-1), var(--counter-2));
    padding:28px 16px 60px;
  }
  .app{max-width:800px; margin:0 auto;}
  
  .masthead{
    text-align:center;
    color:#efe9d8;
    margin-bottom:28px;
  }
  .masthead h1{
    font-family:'Black Han Sans', sans-serif;
    font-size:clamp(1.9rem, 5vw, 3rem);
    margin:0;
    letter-spacing:0.02em;
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
  }
  .masthead p{
    font-size:0.85rem;
    color:#cfc8b0;
    margin:8px auto 0;
    line-height:1.5;
  }

  .ai-panel {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 16px; margin-bottom: 24px; display: flex; gap: 10px;
  }
  .ai-panel input {
    flex: 1; padding: 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.9);
    font-family: inherit; font-size: 0.9rem;
  }
  .ai-panel button {
    background: var(--eco); color: white; border: none; padding: 0 20px;
    border-radius: 8px; font-family: inherit; font-weight: bold; cursor: pointer;
  }
  .ai-panel button:hover { background: var(--eco-soft); }
  .ai-loading { display: none; color: #cfe7d7; font-size: 0.8rem; margin-top: 8px; text-align:center; }

  .result-card{
    background:rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    padding:20px;
    margin-top: 20px;
    color: #f1ecdc;
    display: none;
  }
  .result-card h3 { margin-top: 0; }
  .result-card p { margin: 5px 0; font-size: 0.9rem; color: #a39c86; }
  .result-card span { color: white; font-weight: bold; }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <h1>AI 분리배출 도우미</h1>
    <p>어떤 물건을 버리시나요? AI가 분리배출 항목과 환경 발자국을 분석해 드립니다.</p>
  </div>

  <div class="ai-panel">
    <input type="text" id="aiInput" placeholder="예: 다 마신 플라스틱 커피컵, 낡은 청바지" />
    <button id="aiBtn">AI 분석</button>
  </div>
  <div class="ai-loading" id="aiLoading">Cloudflare AI가 분석 중입니다... ♻️</div>

  <div class="result-card" id="resultCard">
    <h3 id="resName"></h3>
    <p>분류: <span id="resCategory"></span></p>
    <p>예상 탄소 발자국: <span id="resCo2"></span> kg CO₂e</p>
    <p>예상 물 발자국: <span id="resWater"></span> L</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  
  // 백엔드 URL (Cloudflare Worker 배포 후 해당 도메인으로 변경)
  const API_URL = "https://eco-receipt-ai.YOUR_SUBDOMAIN.workers.dev/api/analyze";
  
  const $aiBtn = document.getElementById("aiBtn");
  const $aiInput = document.getElementById("aiInput");
  const $aiLoading = document.getElementById("aiLoading");
  const $resultCard = document.getElementById("resultCard");

  $aiBtn.addEventListener("click", async () => {
    const itemQuery = $aiInput.value.trim();
    if(!itemQuery) return;

    $aiLoading.style.display = "block";
    $resultCard.style.display = "none";
    try {
      // 로컬 테스트용 가짜 지연 및 응답 (실제 사용시엔 아래 fetch 주석 해제)
      /*
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item: itemQuery })
      });
      const data = await response.json();
      if(data.error) throw new Error(data.error);
      */
      
      // 데모용 임시 코드
      await new Promise(resolve => setTimeout(resolve, 1500));
      const data = {
          name: itemQuery,
          category: "daily",
          co2: (Math.random() * 5).toFixed(2),
          water: Math.floor(Math.random() * 100)
      };

      document.getElementById("resName").textContent = data.name;
      document.getElementById("resCategory").textContent = data.category;
      document.getElementById("resCo2").textContent = data.co2;
      document.getElementById("resWater").textContent = data.water;
      
      $resultCard.style.display = "block";
    } catch(err) {
      alert("AI 분석 중 오류가 발생했습니다: " + err.message);
    } finally {
      $aiLoading.style.display = "none";
    }
  });
})();
</script>
</body>
</html>
